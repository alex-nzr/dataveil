version: 1.0

# Основной вариант для установленного Bitrix24:
# DataVeil прочитает параметры подключения из bitrix/.settings.php.
database:
    source: "bitrix_settings"
    bitrix:
        settings_file: "/path/to/bitrix/.settings.php"
        connection_name: "default"

# Альтернативный вариант для прямого подключения к MySQL/MariaDB.
# Оставьте активным только один database-блок: либо bitrix_settings, либо mysql.
#
# database:
#     source: "mysql"
#     mysql:
#         host: "127.0.0.1"
#         port: 3306
#         database: "dataveil_tmp_backup"
#         login: "db_user"
#         password: "db_password"

rules:
    tables:
        - name: "b_search_content"
          action: "truncate"
          comment: "Поисковый индекс; после восстановления может быть перестроен Bitrix"

        - name: "b_user"
          action: "update"
          fields:
              - column: "EMAIL"
                strategy: "email_fake"
                salt_source: "id"
              - column: "LOGIN"
                strategy: "string_random"
                options: { length: 10, prefix: "user_" }
                salt_source: "id"
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "PERSONAL_PHONE"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "WORK_PHONE"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "WORK_COMPANY"
                strategy: "company_fake"
                salt_source: "id"
          where: "ID NOT IN (1)"

        - name: "b_crm_lead"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 12, prefix: "lead_" }
                salt_source: "id"
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "COMPANY_TITLE"
                strategy: "company_fake"
                salt_source: "id"
              - column: "POST"
                strategy: "job_title_fake"
                salt_source: "id"
              - column: "ADDRESS"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "OPPORTUNITY"
                strategy: "amount_fake"
                options: { min: 1000, max: 1000000, decimals: 2, preserve_sign: true }
                salt_source: "id"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        - name: "b_crm_contact"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "POST"
                strategy: "job_title_fake"
                salt_source: "id"
              - column: "ADDRESS"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        - name: "b_crm_company"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "company_fake"
                salt_source: "id"
              - column: "ADDRESS"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "BANKING_DETAILS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        - name: "b_crm_deal"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 12, prefix: "deal_" }
                salt_source: "id"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "ADDITIONAL_INFO"
                strategy: "empty"
              - column: "OPPORTUNITY"
                strategy: "amount_fake"
                options: { min: 1000, max: 1000000, decimals: 2, preserve_sign: true }
                salt_source: "id"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        - name: "b_crm_requisite"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "company_fake"
                salt_source: "id"
              - column: "RQ_FIRST_NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "RQ_SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "RQ_COMPANY_NAME"
                strategy: "company_fake"
                salt_source: "id"
              - column: "RQ_EMAIL"
                strategy: "email_fake"
                salt_source: "id"
              - column: "RQ_PHONE"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "RQ_INN"
                strategy: "empty"
              - column: "RQ_KPP"
                strategy: "empty"
              - column: "RQ_OGRN"
                strategy: "empty"

        - name: "b_crm_bank_detail"
          action: "update"
          fields:
              - column: "RQ_BANK_NAME"
                strategy: "empty"
              - column: "RQ_BANK_ADDR"
                strategy: "empty"
              - column: "RQ_BIK"
                strategy: "empty"
              - column: "RQ_ACC_NUM"
                strategy: "empty"
              - column: "RQ_COR_ACC_NUM"
                strategy: "empty"
              - column: "RQ_IBAN"
                strategy: "empty"
              - column: "RQ_SWIFT"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"

        - name: "b_crm_addr"
          action: "update"
          fields:
              - column: "ADDRESS_1"
                strategy: "empty"
              - column: "ADDRESS_2"
                strategy: "empty"
              - column: "CITY"
                strategy: "empty"
              - column: "POSTAL_CODE"
                strategy: "empty"
              - column: "REGION"
                strategy: "empty"
              - column: "PROVINCE"
                strategy: "empty"
              - column: "COUNTRY"
                strategy: "empty"
              - column: "COUNTRY_CODE"
                strategy: "empty"

        # Пример смарт-процесса. Номер таблицы и UF-поля нужно заменить под конкретный портал.
        - name: "b_crm_dynamic_items_1000"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 12, prefix: "smart_" }
                salt_source: "id"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "OPPORTUNITY"
                strategy: "amount_fake"
                options: { min: 1000, max: 1000000, decimals: 2, preserve_sign: true }
                salt_source: "id"
              - column: "UF_EXAMPLE_TEXT"
                strategy: "empty"

        - name: "b_crm_dynamic_items_1000_index"
          action: "truncate"

        - name: "b_crm_lead_index"
          action: "truncate"
        - name: "b_crm_contact_index"
          action: "truncate"
        - name: "b_crm_company_index"
          action: "truncate"
        - name: "b_crm_deal_index"
          action: "truncate"

consistency_groups:
    - id: "crm_phone_unique"
      comment: "Телефоны CRM заменяются согласованно в мультиполях и связанных serialized-данных активностей"
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns: ["ENTITY_ID", "VALUE", "TYPE_ID"]
          filters:
              - column: "TYPE_ID"
                value: "PHONE"
      generator:
          deterministic: true
          strategy: "phone_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join: { key_column: "ID", ref_column: "ID" }
          - table: "b_crm_act_comm"
            column: "ENTITY_SETTINGS"
            join:
                type: "serialized_value_match"
                entity_id_column: "OWNER_ID"
                ref_entity_column: "ENTITY_ID"
            serialization:
                type: "php_serialize"
                match_key: "PHONE"
                match_value_source: "anchor.VALUE"

    - id: "crm_email_unique"
      comment: "Email CRM заменяются согласованно в мультиполях и связанных serialized-данных активностей"
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns: ["ENTITY_ID", "VALUE", "TYPE_ID"]
          filters:
              - column: "TYPE_ID"
                value: "EMAIL"
      generator:
          deterministic: true
          strategy: "email_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join: { key_column: "ID", ref_column: "ID" }
          - table: "b_crm_act_comm"
            column: "ENTITY_SETTINGS"
            join:
                type: "serialized_value_match"
                entity_id_column: "OWNER_ID"
                ref_entity_column: "ENTITY_ID"
            serialization:
                type: "php_serialize"
                match_key: "EMAIL"
                match_value_source: "anchor.VALUE"
