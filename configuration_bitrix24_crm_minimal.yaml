version: 1.0

database:
    source: "bitrix_settings"
    bitrix:
        settings_file: "/home/bitrix/www/bitrix/.settings.php"
        connection_name: "default"

rules:
    tables:
        - name: "b_search_content"
          action: "truncate"
          comment: "Search index, can be rebuilt by Bitrix"

        - name: "b_user"
          action: "update"
          fields:
              - column: "EMAIL"
                strategy: "email_fake"
                salt_source: "id"
              - column: "LOGIN"
                strategy: "string_random"
                options: { length: 10, prefix: "user_" }
                salt_source: "id"
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "PERSONAL_PHONE"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "PERSONAL_MOBILE"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "WORK_PHONE"
                strategy: "phone_fake"
                salt_source: "id"
          where: "ID NOT IN (1)"

        - name: "b_crm_lead"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 12, prefix: "lead_" }
                salt_source: "id"
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "COMPANY_TITLE"
                strategy: "company_fake"
                salt_source: "id"
              - column: "POST"
                strategy: "string_random"
                options: { length: 12, prefix: "post_" }
                salt_source: "id"
              - column: "ADDRESS"
                strategy: "empty"
              - column: "ADDRESS_2"
                strategy: "empty"
              - column: "ADDRESS_CITY"
                strategy: "empty"
              - column: "ADDRESS_POSTAL_CODE"
                strategy: "empty"
              - column: "ADDRESS_REGION"
                strategy: "empty"
              - column: "ADDRESS_PROVINCE"
                strategy: "empty"
              - column: "ADDRESS_COUNTRY"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "STATUS_DESCRIPTION"
                strategy: "empty"
              - column: "OPPORTUNITY"
                strategy: "amount_fake"
                options: { min: 1000, max: 100000, decimals: 2, preserve_sign: true }
                salt_source: "id"
              - column: "ORIGINATOR_ID"
                strategy: "empty"
              - column: "ORIGIN_ID"
                strategy: "empty"

        - name: "b_crm_contact"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "POST"
                strategy: "string_random"
                options: { length: 12, prefix: "post_" }
                salt_source: "id"
              - column: "ADDRESS"
                strategy: "empty"
              - column: "ADDRESS_2"
                strategy: "empty"
              - column: "ADDRESS_CITY"
                strategy: "empty"
              - column: "ADDRESS_POSTAL_CODE"
                strategy: "empty"
              - column: "ADDRESS_REGION"
                strategy: "empty"
              - column: "ADDRESS_PROVINCE"
                strategy: "empty"
              - column: "ADDRESS_COUNTRY"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "ORIGINATOR_ID"
                strategy: "empty"
              - column: "ORIGIN_ID"
                strategy: "empty"

        - name: "b_crm_company"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "company_fake"
                salt_source: "id"
              - column: "ADDRESS"
                strategy: "empty"
              - column: "ADDRESS_2"
                strategy: "empty"
              - column: "ADDRESS_CITY"
                strategy: "empty"
              - column: "ADDRESS_POSTAL_CODE"
                strategy: "empty"
              - column: "ADDRESS_REGION"
                strategy: "empty"
              - column: "ADDRESS_PROVINCE"
                strategy: "empty"
              - column: "ADDRESS_COUNTRY"
                strategy: "empty"
              - column: "REG_ADDRESS"
                strategy: "empty"
              - column: "REG_ADDRESS_2"
                strategy: "empty"
              - column: "REG_ADDRESS_CITY"
                strategy: "empty"
              - column: "REG_ADDRESS_POSTAL_CODE"
                strategy: "empty"
              - column: "REG_ADDRESS_REGION"
                strategy: "empty"
              - column: "REG_ADDRESS_PROVINCE"
                strategy: "empty"
              - column: "REG_ADDRESS_COUNTRY"
                strategy: "empty"
              - column: "ADDRESS_LEGAL"
                strategy: "empty"
              - column: "BANKING_DETAILS"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "REVENUE"
                strategy: "amount_fake"
                options: { min: 100000, max: 5000000, decimals: 2, preserve_sign: true }
                salt_source: "id"
              - column: "ORIGINATOR_ID"
                strategy: "empty"
              - column: "ORIGIN_ID"
                strategy: "empty"

        - name: "b_crm_deal"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 12, prefix: "deal_" }
                salt_source: "id"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "ADDITIONAL_INFO"
                strategy: "empty"
              - column: "OPPORTUNITY"
                strategy: "amount_fake"
                options: { min: 1000, max: 1000000, decimals: 2, preserve_sign: true }
                salt_source: "id"
              - column: "ORIGINATOR_ID"
                strategy: "empty"
              - column: "ORIGIN_ID"
                strategy: "empty"

        - name: "b_crm_requisite"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "company_fake"
                salt_source: "id"
              - column: "RQ_NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_FIRST_NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "id"
              - column: "RQ_SECOND_NAME"
                strategy: "middlename_fake"
                salt_source: "id"
              - column: "RQ_COMPANY_NAME"
                strategy: "company_fake"
                salt_source: "id"
              - column: "RQ_COMPANY_FULL_NAME"
                strategy: "company_fake"
                salt_source: "id"
              - column: "RQ_DIRECTOR"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_ACCOUNTANT"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_CEO_NAME"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_CONTACT"
                strategy: "name_fake"
                salt_source: "id"
              - column: "RQ_EMAIL"
                strategy: "email_fake"
                salt_source: "id"
              - column: "RQ_PHONE"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "RQ_FAX"
                strategy: "phone_fake"
                salt_source: "id"
              - column: "RQ_INN"
                strategy: "empty"
              - column: "RQ_KPP"
                strategy: "empty"
              - column: "RQ_OGRN"
                strategy: "empty"
              - column: "RQ_OGRNIP"
                strategy: "empty"
              - column: "RQ_OKPO"
                strategy: "empty"
              - column: "RQ_BANK_NAME"
                strategy: "empty"
              - column: "RQ_BIK"
                strategy: "empty"
              - column: "RQ_ACC_NUM"
                strategy: "empty"
              - column: "RQ_COR_ACC_NUM"
                strategy: "empty"

        - name: "b_crm_timeline"
          action: "update"
          fields:
              - column: "COMMENT"
                strategy: "empty"
              - column: "SETTINGS"
                strategy: "empty"

        - name: "b_crm_timeline_search"
          action: "update"
          fields:
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        - name: "b_crm_lead_index"
          action: "truncate"
        - name: "b_crm_contact_index"
          action: "truncate"
        - name: "b_crm_company_index"
          action: "truncate"
        - name: "b_crm_deal_index"
          action: "truncate"

consistency_groups:
    - id: "crm_phone_unique"
      comment: "Anonymize CRM phones in b_crm_field_multi for leads, contacts and companies."
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns: ["ENTITY_ID", "ENTITY_TYPE_ID", "VALUE", "TYPE_ID"]
          filters:
              - column: "TYPE_ID"
                value: "PHONE"
      generator:
          deterministic: true
          strategy: "phone_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join: { key_column: "ID", ref_column: "ID" }
          - table: "b_crm_act_comm"
            column: "ENTITY_SETTINGS"
            join:
                type: "serialized_value_match"
                entity_id_column: "OWNER_ID"
                ref_entity_column: "ENTITY_ID"
                filters:
                    - column: "OWNER_TYPE_ID"
                      value_source: "anchor.ENTITY_TYPE_ID"
            serialization:
                type: "php_serialize"
                match_key: "PHONE"
                match_value_source: "anchor.VALUE"

    - id: "crm_email_unique"
      comment: "Anonymize CRM emails in b_crm_field_multi for leads, contacts and companies."
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns: ["ENTITY_ID", "ENTITY_TYPE_ID", "VALUE", "TYPE_ID"]
          filters:
              - column: "TYPE_ID"
                value: "EMAIL"
      generator:
          deterministic: true
          strategy: "email_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join: { key_column: "ID", ref_column: "ID" }
          - table: "b_crm_act_comm"
            column: "ENTITY_SETTINGS"
            join:
                type: "serialized_value_match"
                entity_id_column: "OWNER_ID"
                ref_entity_column: "ENTITY_ID"
                filters:
                    - column: "OWNER_TYPE_ID"
                      value_source: "anchor.ENTITY_TYPE_ID"
            serialization:
                type: "php_serialize"
                match_key: "EMAIL"
                match_value_source: "anchor.VALUE"
