              - column: "MESSAGE_OUT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "EMAIL_TEMPLATE"
                strategy: "string_random"
                options: { length: 50 }
              - column: "NOTIFY_TITLE"
                strategy: "string_random"
                options: { length: 50 }
              - column: "NOTIFY_BUTTONS"
                strategy: "string_random"
                options: { length: 100 }

        # 19. Sonet Private Messages
        - name: "b_sonet_messages"
          action: "update"
          fields:
