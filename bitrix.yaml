              - column: "SEARCH_CONTENT"
                strategy: "empty"
                options: { length: 100 }
              - column: "SPAM_WORDS"
                strategy: "string_random"
                options: { length: 50 }

        # 18. IM Messages
        - name: "b_im_message"
          action: "update"
