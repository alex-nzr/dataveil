consistency_groups:
    # Group: Phone numbers in multi-fields
    - id: "crm_phone_unique"
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns:
              - "ENTITY_ID"
              - "VALUE"
              - "TYPE_ID"
          filters:
              - column: "TYPE_ID"
                value: "PHONE"
      generator:
          deterministic: true
          strategy: "phone_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join:
                key_column: "ID"
                ref_column: "ID"
          - table: "b_crm_act_comm"
            column: "ENTITY_SETTINGS"
            join:
                type: "serialized_value_match"
                entity_id_column: "OWNER_ID"
                ref_entity_column: "ENTITY_ID"
                filters:
                    - column: "OWNER_TYPE_ID"
                      value: "3"
            serialization:
                type: "php_serialize"
                match_key: "PHONE"
                match_value_source: "anchor.VALUE"
                replace: true

    # Group: Email addresses in multi-fields
    - id: "crm_email_unique"
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns:
              - "ENTITY_ID"
              - "VALUE"
          filters:
              - column: "TYPE_ID"
                value: "EMAIL"
      generator:
          deterministic: true
          strategy: "email_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join:
                key_column: "ID"
                ref_column: "ID"
          - table: "b_crm_act_comm"
            column: "ENTITY_SETTINGS"
            join:
                type: "serialized_value_match"
                entity_id_column: "OWNER_ID"
                ref_entity_column: "ENTITY_ID"
                filters:
                    - column: "OWNER_TYPE_ID"
                      value: "3"
            serialization:
                type: "php_serialize"
                match_key: "EMAIL"
                match_value_source: "anchor.VALUE"
                replace: true

    # Group: URLs in multi-fields
    - id: "crm_url_unique"
      anchor:
          table: "b_crm_field_multi"
          id_column: "ID"
          context_columns:
              - "ENTITY_ID"
              - "VALUE"
          filters:
              - column: "TYPE_ID"
                value: "WEB"
      generator:
          deterministic: true
          strategy: "url_fake"
          salt_source: "row_id"
      targets:
          - table: "b_crm_field_multi"
            column: "VALUE"
            join:
                key_column: "ID"
                ref_column: "ID"