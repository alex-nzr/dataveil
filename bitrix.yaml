                strategy: "string_random"
                options: { length: 50 }
              - column: "NUMBER"
                strategy: "string_random"
                options: { length: 20 }
              - column: "VALUE"
                strategy: "string_random"
                options: { length: 100 }
              - column: "VALUES"
                strategy: "string_random"
                options: { length: 100 }

        # 21. Sale Order Properties
        - name: "b_sale_order_props_value"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "string_random"
                options: { length: 50 }
              - column: "VALUE"
                strategy: "string_random"
                options: { length: 100 }

        # 22. App Passwords
        - name: "b_app_password"
          action: "update"
          fields:
              - column: "LAST_IP"
                strategy: "ip_fake"
              - column: "COMMENT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "SYSCOMMENT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "CODE"
                strategy: "string_random"
                options: { length: 50 }

        # 23. Location Addresses
        - name: "b_location_address"
          action: "update"
          fields:
              - column: "LATITUDE"
                strategy: "string_random"
                options: { length: 10, numeric: true }
              - column: "LONGITUDE"
                strategy: "string_random"
                options: { length: 10, numeric: true }

        # 24. Booking Notes
        - name: "b_booking_booking_note"
          action: "update"
          fields:
              - column: "DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }

        # 25. Mail OAuth (Tokens and Secrets)
        - name: "b_mail_oauth"
          action: "update"
          fields:
              - column: "TOKEN"
                strategy: "string_random"
                options: { length: 100 }
              - column: "REFRESH_TOKEN"
                strategy: "string_random"
                options: { length: 100 }
              - column: "SECRET"
                strategy: "string_random"
                options: { length: 50 }

        # 26. CRM Activities
        - name: "b_crm_act"
          action: "update"
          fields:
              - column: "SUBJECT"
                strategy: "string_random"
                options: { length: 50 }
              - column: "DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }
              - column: "LOCATION"
                strategy: "string_random"
                options: { length: 50 }
              - column: "SETTINGS"
                strategy: "string_random"
                options: { length: 100 }
              - column: "URN"
                strategy: "string_random"
                options: { length: 50 }
              - column: "PROVIDER_PARAMS"
                strategy: "string_random"
                options: { length: 100 }
              - column: "PROVIDER_DATA"
                strategy: "string_random"
                options: { length: 100 }
              - column: "SEARCH_CONTENT"
                strategy: "emtpy"
        # 27. CRM Addresses
        - name: "b_crm_addr"
          action: "update"
          fields:
              - column: "ADDRESS_1"
                strategy: "address_fake"
              - column: "ADDRESS_2"
                strategy: "address_fake"
              - column: "CITY"
                strategy: "city_fake"
              - column: "POSTAL_CODE"
                strategy: "string_random"
                options: { length: 6, numeric: true }
              - column: "REGION"
                strategy: "string_random"
                options: { length: 20 }
              - column: "PROVINCE"
                strategy: "string_random"
                options: { length: 20 }
              - column: "COUNTRY"
                strategy: "country_fake"
              - column: "COUNTRY_CODE"
                strategy: "string_random"
                options: { length: 2 }

        # 28. CRM Requisites (Highly sensitive - tax IDs, documents, personal data)
        - name: "b_crm_requisite"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "string_random"
                options: { length: 50 }
              - column: "CODE"
                strategy: "string_random"
                options: { length: 20 }
              - column: "XML_ID"
                strategy: "string_random"
                options: { length: 20 }
              - column: "ORIGINATOR_ID"
                strategy: "string_random"
                options: { length: 50 }
              - column: "RQ_NAME"
                strategy: "name_fake"
              - column: "RQ_FIRST_NAME"
