#
# Example with default configuration
# WARNING: Untested
# 
version: 1.0

database:
    source: "bitrix_settings"
    bitrix:
        settings_file: "/home/bitrix/www/bitrix/.settings.php"
        connection_name: "default"

rules:
    tables:
        # Module: "abtest"
        - name: "b_abtest"
          action: "truncate"

        # Module: "advertising"
        - name: "b_adv_banner"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "string_random"
                options: { length: 10, prefix: "adv_" }
              - column: "IMAGE_ALT"
                strategy: "string_random"
                options: { length: 10, prefix: "adv_" }
        - name: "b_adv_contract"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "string_random"
                options: { length: 10, prefix: "Contract " }
              - column: "DESCRIPTION"
                strategy: "string_random"
                options: { length: 30 }

        # Module: "search"
        - name: "b_search_content"
          action: "truncate"
        - name: "b_search_content_freq"
          action: "truncate"
        - name: "b_search_content_param"
          action: "truncate"
        - name: "b_search_content_right"
          action: "truncate"
        - name: "b_search_content_site"
          action: "truncate"
        - name: "b_search_content_stem"
          action: "truncate"
        - name: "b_search_content_text"
          action: "truncate"
        - name: "b_search_content_title"
          action: "truncate"
        - name: "b_search_custom_rank"
          action: "truncate"
        - name: "b_search_phrase"
          action: "truncate"
        - name: "b_search_stem"
          action: "truncate"
        - name: "b_search_suggest"
          action: "truncate"
        - name: "b_search_tags"
          action: "truncate"
        - name: "b_search_user_right"
          action: "truncate"

        # Module: "statistics"
        - name: "b_stat_adv"
          action: "truncate"
        - name: "b_stat_adv_day"
          action: "truncate"
        - name: "b_stat_adv_event"
          action: "truncate"
        - name: "b_stat_adv_event_day"
          action: "truncate"
        - name: "b_stat_adv_guest"
          action: "truncate"
        - name: "b_stat_adv_page"
          action: "truncate"
        - name: "b_stat_adv_searcher"
          action: "truncate"
        - name: "b_stat_browser"
          action: "truncate"
        - name: "b_stat_city"
          action: "truncate"
        - name: "b_stat_city_day"
          action: "truncate"
        - name: "b_stat_city_ip"
          action: "truncate"
        - name: "b_stat_country"
          action: "truncate"
        - name: "b_stat_country_day"
          action: "truncate"
        - name: "b_stat_day"
          action: "truncate"
        - name: "b_stat_day_site"
          action: "truncate"
        - name: "b_stat_ddl"
          action: "truncate"
        - name: "b_stat_event"
          action: "truncate"
        - name: "b_stat_event_day"
          action: "truncate"
        - name: "b_stat_event_list"
          action: "truncate"
        - name: "b_stat_guest"
          action: "truncate"
        - name: "b_stat_hit"
          action: "truncate"
        - name: "b_stat_page"
          action: "truncate"
        - name: "b_stat_page_adv"
          action: "truncate"
        - name: "b_stat_path"
          action: "truncate"
        - name: "b_stat_path_adv"
          action: "truncate"
        - name: "b_stat_path_cache"
          action: "truncate"
        - name: "b_stat_phrase_list"
          action: "truncate"
        - name: "b_stat_referer"
          action: "truncate"
        - name: "b_stat_referer_list"
          action: "truncate"
        - name: "b_stat_searcher"
          action: "truncate"
        - name: "b_stat_searcher_day"
          action: "truncate"
        - name: "b_stat_searcher_hit"
          action: "truncate"
        - name: "b_stat_searcher_params"
          action: "truncate"
        - name: "b_stat_session"
          action: "truncate"
        - name: "b_stat_session_data"
          action: "truncate"

        # XML tree
        - name: "b_xml_tree"
          action: "truncate"
        - name: "b_event_log"
          action: "truncate"

        # 2. User & Authentication Tables
        - name: "b_user"
          action: "update"
          fields:
              - column: "EMAIL"
                strategy: "email_fake"
              - column: "LOGIN"
                strategy: "string_random"
                options: { length: 10, prefix: "user_" }
              - column: "NAME"
                strategy: "name_fake"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
              - column: "PERSONAL_PHONE"
                strategy: "phone_fake"
              - column: "PERSONAL_MOBILE"
                strategy: "phone_fake"
              - column: "PERSONAL_FAX"
                strategy: "phone_fake"
              - column: "PERSONAL_STREET"
                strategy: "address_fake"
              - column: "PERSONAL_CITY"
                strategy: "city_fake"
              - column: "PERSONAL_STATE"
                strategy: "string_random"
                options: { length: 20 }
              - column: "PERSONAL_ZIP"
                strategy: "string_random"
                options: { length: 6, numeric: true }
              - column: "PERSONAL_COUNTRY"
                strategy: "country_fake"
              - column: "WORK_COMPANY"
                strategy: "company_fake"
              - column: "WORK_DEPARTMENT"
                strategy: "string_random"
                options: { length: 20 }
              - column: "WORK_POSITION"
                strategy: "string_random"
                options: { length: 20 }
              - column: "WORK_PHONE"
                strategy: "phone_fake"
              - column: "WORK_FAX"
                strategy: "phone_fake"
              - column: "WORK_STREET"
                strategy: "address_fake"
              - column: "WORK_CITY"
                strategy: "city_fake"
              - column: "WORK_STATE"
                strategy: "string_random"
                options: { length: 20 }
              - column: "WORK_ZIP"
                strategy: "string_random"
                options: { length: 6, numeric: true }
              - column: "WORK_COUNTRY"
                strategy: "country_fake"
              - column: "ADMIN_NOTES"
                strategy: "empty"
          where: "ID NOT IN (1)"
        - name: "b_user_phone_auth"
          action: "truncate"
        - name: "b_user_hit_auth"
          action: "truncate"

        # 3. CRM Tables
        - name: "b_crm_contact"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "name_fake"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
              - column: "SECOND_NAME"
                strategy: "middlename_fake"
              - column: "FULL_NAME"
                strategy: "name_fake"
              - column: "ADDRESS"
                strategy: "address_fake"
              - column: "COMMENTS"
                strategy: "string_random"
                options: { length: 100 }

        - name: "b_crm_company"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "company_fake"
              - column: "ADDRESS"
                strategy: "address_fake"
              - column: "ADDRESS_LEGAL"
                strategy: "address_fake"
              - column: "BANKING_DETAILS"
                strategy: "string_random"
                options: { length: 100 }
              - column: "COMMENTS"
                strategy: "string_random"
                options: { length: 100 }

        - name: "b_crm_invoice"
          action: "update"
          fields:
              - column: "USER_DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }
              - column: "ADDITIONAL_INFO"
                strategy: "string_random"
                options: { length: 100 }
              - column: "COMMENTS"
                strategy: "string_random"
                options: { length: 100 }
              - column: "ORDER_TOPIC"
                strategy: "string_random"
                options: { length: 50 }
              - column: "TRACKING_NUMBER"
                strategy: "string_random"
                options: { length: 20 }


        # Group: CRM Deal titles
        - name: "b_crm_deal"
          fields:
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # 7. Sale & Order Tables
        - name: "b_sale_order"
          action: "update"
          fields:
              - column: "USER_DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }
              - column: "ADDITIONAL_INFO"
                strategy: "string_random"
                options: { length: 100 }
              - column: "COMMENTS"
                strategy: "string_random"
                options: { length: 100 }
              - column: "ORDER_TOPIC"
                strategy: "string_random"
                options: { length: 50 }
              - column: "TRACKING_NUMBER"
                strategy: "string_random"
                options: { length: 20 }

        # 8. Blog Tables
        - name: "b_blog_post"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 50 }
              - column: "PREVIEW_TEXT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "DETAIL_TEXT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "KEYWORDS"
                strategy: "string_random"
                options: { length: 50 }
              - column: "SEO_TITLE"
                strategy: "string_random"
                options: { length: 50 }
              - column: "SEO_TAGS"
                strategy: "string_random"
                options: { length: 50 }
              - column: "SEO_DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }

        - name: "b_blog_comment"
          action: "update"
          fields:
              - column: "AUTHOR_NAME"
                strategy: "name_fake"
              - column: "AUTHOR_EMAIL"
                strategy: "email_fake"
              - column: "POST_MESSAGE"
                strategy: "string_random"
                options: { length: 100 }

        - name: "b_blog_trackback"
          action: "update"
          fields:
              - column: "URL"
                strategy: "url_fake"
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 50 }

        # 9. Forum Tables
        - name: "b_forum_message"
          action: "update"
          fields:
              - column: "POST_MESSAGE"
                strategy: "string_random"
                options: { length: 100 }
              - column: "POST_MESSAGE_HTML"
                strategy: "string_random"
                options: { length: 100 }
              - column: "AUTHOR_NAME"
                strategy: "name_fake"
              - column: "AUTHOR_EMAIL"
                strategy: "email_fake"
              - column: "AUTHOR_IP"
                strategy: "ip_fake"
              - column: "AUTHOR_REAL_IP"
                strategy: "ip_fake"
              - column: "EDIT_REASON"
                strategy: "string_random"
                options: { length: 100 }
              - column: "MAIL_HEADER"
                strategy: "string_random"
                options: { length: 100 }
              - column: "SERVICE_DATA"
                strategy: "string_random"
                options: { length: 100 }

        # 10. Social Network (Sonet) Tables
        - name: "b_sonet_log"
          action: "update"
          fields:
              - column: "TITLE"
