              - column: "PARAMS"
                strategy: "string_random"
                options: { length: 100 }

        # 11. Task Tables
        - name: "b_tasks"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "string_random"
                options: { length: 50 }
              - column: "DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }
              - column: "DECLINE_REASON"
                strategy: "string_random"
                options: { length: 100 }

        # 12. AI Tables
        - name: "b_ai_history"
          action: "update"
          fields:
              - column: "REQUEST_TEXT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "RESULT_TEXT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "CONTEXT"
                strategy: "string_random"
                options: { length: 100 }

        - name: "b_ai_prompt"
          action: "update"
          fields:
              - column: "PROMPT"
                strategy: "string_random"
                options: { length: 100 }
              - column: "TEXT_TRANSLATES"
                strategy: "string_random"
                options: { length: 100 }

        # 13. CRM Timeline Notes
        - name: "b_crm_timeline_note"
          action: "update"
          fields:
              - column: "TEXT"
                strategy: "string_random"
                options: { length: 100 }

        # 14. Phone Tracking
        - name: "b_crm_tracking_phone_number"
          action: "update"
          fields:
              - column: "VALUE"
                strategy: "phone_fake"

        # 15. Forum Email
        - name: "b_forum_email"
          action: "update"
          fields:
              - column: "EMAIL"
                strategy: "email_fake"
              - column: "EMAIL_GROUP"
                strategy: "email_fake"
              - column: "URL_TEMPLATES_MESSAGE"
                strategy: "url_fake"

        # 16. Calendar Events
        - name: "b_calendar_event"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "string_random"
                options: { length: 50 }
              - column: "DESCRIPTION"
                strategy: "string_random"
                options: { length: 100 }
              - column: "LOCATION"
                strategy: "string_random"
                options: { length: 50 }
              - column: "MEETING"
                strategy: "string_random"
                options: { length: 100 }
              - column: "REMIND"
                strategy: "string_random"
                options: { length: 100 }
              - column: "SEARCHABLE_CONTENT"
                strategy: "string_random"
                options: { length: 100 }

        # 17. Mail Messages
        - name: "b_mail_message"
          action: "update"
